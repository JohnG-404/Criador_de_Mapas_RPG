name: App de desktop

# Gera os instaladores do app de desktop (Tauri) para Windows, Linux e macOS.
# Em pushes na main, em PRs que mexem no app e quando disparado à mão, os
# instaladores ficam como artefatos da execução (aba Actions → execução → Artifacts).
# Ao enviar uma tag v* (por exemplo v0.5.0), publica uma release com os instaladores.
# Só envie a tag quando quiser publicar. Também dá para publicar pela aba Actions:
# Run workflow → marque "Publicar uma release".
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/desktop.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar uma release (a tag vX.Y.Z sai da versão do package.json)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
            args: ''
          - platform: ubuntu-22.04
            name: linux
            args: ''
          - platform: macos-latest
            name: macos
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do Linux
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Gerar instaladores
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || (inputs.publicar && 'v__VERSION__') || '' }}
          releaseName: 'Atlas Board v__VERSION__'
          releaseBody: |
            Instaladores do Atlas Board para desktop.

            - **Windows:** baixe o arquivo `_x64-setup.exe`. Como o instalador não tem assinatura digital, o SmartScreen pode avisar na primeira vez: clique em "Mais informações" e depois em "Executar assim mesmo".
            - **Linux:** `.AppImage`, `.deb` ou `.rpm`.
            - **macOS:** `.dmg` universal. Abra com o botão direito e escolha Abrir na primeira vez.

            A versão web continua em https://johng-404.github.io/Criador_de_Mapas_RPG/
          releaseDraft: false
          prerelease: false

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-board-${{ matrix.name }}
          path: ${{ join(fromJSON(steps.tauri.outputs.artifactPaths), fromJSON('"\n"')) }}
          if-no-files-found: error
